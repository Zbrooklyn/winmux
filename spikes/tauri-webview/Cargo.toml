[package]
name = "winmux-tauri-spike"
version = "0.1.0"
edition = "2021"

# Stage 0 spike: can a Tauri 2 window host an embedded, programmable browser panel
# (the Electron <webview> replacement WinMux would need)? Uses the unstable
# multiwebview API — that instability is itself a spike finding.
[dependencies]
tauri = { version = "2", features = ["unstable"] }
tauri-build = "2"

[build-dependencies]
tauri-build = "2"
