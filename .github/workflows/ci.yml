name: CI

on:
  push:
    branches: [master, feature/phase8-electron-shell]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build + harness (Windows)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/electron
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/electron/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium

      - name: Compile Electron/TypeScript
        run: npm run build:electron

      - name: Run harness (serial, CI-safe scenarios)
        # Curated set that runs clean on a headless runner. Tailscale-, display-,
        # and installed-app-dependent scenarios stay out and run locally via
        # `npm run verify`. WINMUX_VERIFY_CONCURRENCY=1 removes the load-flakes.
        run: node verify.cjs port config cli remote agent-state agentjob agentspawn keybindings theme-import paste migrate markdown diff-tab md-rich marks cmdtag approvecard resume
        env:
          WINMUX_VERIFY_CONCURRENCY: "1"
          WINMUX_CHECK_TIMEOUT_MS: "300000"
