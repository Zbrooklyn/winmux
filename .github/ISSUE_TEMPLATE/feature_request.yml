name: Feature request
description: Suggest something WinMux should do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: The problem or workflow behind the request, not just the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Which surface
      options:
        - Desktop app
        - Browser
        - Phone
        - CLI / agent integration
        - Any
  - type: textarea
    id: alternatives
    attributes:
      label: Anything you have tried or considered
