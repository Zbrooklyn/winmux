<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>wmux — PowerShell</title>
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/cockpit.css">
<style>
  /* The pane body hosts the real terminals instead of the mockup's fake rows. */
  .pbody { background: var(--term-bg); }
  .term-area { position: absolute; inset: 0; }
  .term-host { position: absolute; inset: 0; padding: 10px 6px 10px 12px; }
  .xterm { height: 100%; }
  .pane.focused { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent); }
  /* Tabs hug their content instead of the mockup's fixed ~166px width. */
  .ptab { flex: 0 0 auto; min-width: 0; max-width: 220px; padding: 0 10px; gap: 8px; }
  .ptab .x { margin-left: 2px; }
  /* Find bar (Ctrl+F) — floats over the terminal body. */
  .findbar { position: absolute; top: 8px; right: 12px; z-index: 20; display: none; align-items: center; gap: 4px;
    background: var(--bg1); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; box-shadow: 0 8px 24px rgba(0,0,0,.35); }
  .findbar.on { display: flex; }
  .findbar input { background: var(--bg0); border: 1px solid var(--border); border-radius: 6px; color: var(--text);
    font-size: 12px; padding: 4px 8px; width: 170px; outline: none; }
  .findbar input:focus { border-color: var(--accent); }
  .findbar .fb-btn { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: var(--faint); cursor: pointer; }
  .findbar .fb-btn:hover { background: color-mix(in srgb, var(--text) 9%, transparent); color: var(--text); }
  .findbar .fb-btn svg { width: 14px; height: 14px; }
  /* Manual theme override (Settings). Unset = follow system. These win over the
     mockup's prefers-color-scheme media query because of the attribute selector. */
  :root[data-theme="light"] { --bg0:#fff; --bg1:#f6f6f6; --bg2:#eeeef0; --bg3:#e6e6e8; --border:#e2e2e2; --border-s:#c4c4c4; --text:#232323; --muted:#5c5c5c; --faint:#a0a0a0; --term-bg:#fbfbfb; }
  :root[data-theme="dark"]  { --bg0:#1e1e1e; --bg1:#262626; --bg2:#2d2d2d; --bg3:#333; --border:#363636; --border-s:#4a4a4a; --text:#dadada; --muted:#a8a8a8; --faint:#6b6b6b; --term-bg:#1a1a1a; }
  .ofmi[data-on]::after { content: "✓"; margin-left: auto; color: var(--accent); font-weight: 700; }
  /* Zoom: one pane fills the workspace; siblings + dividers hide. */
  .wsrow.zoomed > .pane:not(.zoom-on) { display: none; }
  .wsrow.zoomed > .wsdiv { display: none; }
  .pane .pc-zoom.on { color: var(--accent); }
  /* Connection status pill in the tab row */
  .connpill { display:flex; align-items:center; gap:6px; margin-left:auto; padding:0 12px; font-size:11px; color:var(--faint); }
  .connpill .dot { width:8px; height:8px; border-radius:50%; background:var(--idle); }
  .connpill[data-state="open"] .dot { background:var(--ok); }
  .connpill[data-state="closed"] .dot { background:var(--err); }
</style>
</head>
<body>
<div class="cockpit" id="root" data-mode="full" data-view="focus" data-dock="closed" data-sidebar="open">

  <aside class="sessions">
    <div class="sx-head"><span>Projects</span><span class="n" id="sx-count">1</span></div>
    <div class="sx-list" id="sx-list">
      <div class="prow" data-active>
        <div class="pfolder"><svg viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z"/></svg></div>
        <div class="pinfo">
          <div class="pname" id="p-name">PowerShell</div>
          <div class="psub" id="p-sub">connecting…</div>
        </div>
      </div>
    </div>
    <div class="sx-foot">
      <span class="sxbtn" id="open-settings" title="Settings — theme" role="button" aria-label="Settings">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"/></svg>
      </span>
      <span class="sxsp"></span>
      <span class="brand"><b>●</b> wmux</span>
    </div>
  </aside>

  <div class="main">
    <div class="workspace">
      <div class="wsrow" id="wsrow"></div>
    </div>
  </div>

</div>

<script src="/vendor/xterm.js"></script>
<script src="/vendor/addon-fit.js"></script>
<script src="/vendor/addon-search.js"></script>
<script src="/app.js"></script>
</body>
</html>
